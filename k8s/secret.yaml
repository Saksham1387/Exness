apiVersion: v1
kind: Secret
metadata:
  name: exness-secrets
  namespace: default
type: Opaque
stringData:
  # Replace these with your real values before applying.
  # You can also manage this with an external secret store (Vault, AWS Secrets Manager, etc.)
  DATABASE_URL: "postgresql://user:password@your-postgres-host:5432/exness"
  JWT_SECRET: "change-me-to-a-long-random-secret"
  REDIS_URL: "redis://redis-service:6379"
