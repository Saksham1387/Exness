apiVersion: apps/v1
kind: Deployment
metadata:
  name: ws-server
  namespace: default
spec:
  # Keep at 1 replica unless you add sticky sessions / shared subscription state.
  # With 2+ replicas, a client may connect to a pod that hasn't subscribed to a
  # particular Redis channel yet, causing missed messages.
  replicas: 1
  selector:
    matchLabels:
      app: ws-server
  template:
    metadata:
      labels:
        app: ws-server
    spec:
      containers:
        - name: ws-server
          image: your-registry/exness-ws:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: exness-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: exness-secrets
                  key: REDIS_URL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: ws-service
  namespace: default
spec:
  selector:
    app: ws-server
  ports:
    - port: 3001
      targetPort: 3001
  type: ClusterIP
